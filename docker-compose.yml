
services:
  backend:
    build: .
    container_name: ai_hospital_backend
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./chroma_parent_child:/app/chroma_parent_child
    restart: unless-stopped

  frontend:
    build: .
    container_name: ai_hospital_frontend
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
